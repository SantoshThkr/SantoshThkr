name: Refresh GitHub profile analytics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_analytics.py'
      - '.github/workflows/profile-analytics.yml'
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: write

concurrency:
  group: profile-analytics
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate analytics using the GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: SantoshThkr
        run: python3 scripts/generate_analytics.py

      - name: Save updated charts to this repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/analytics/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh GitHub profile analytics'
            git push
          fi
